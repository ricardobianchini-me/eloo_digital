name: Deploy to VM-2 (eloo.digital)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-eloo-digital
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.OCI_SSH_KEY }}" > ~/.ssh/oci_key
          chmod 600 ~/.ssh/oci_key
          ssh-keyscan -H "${{ secrets.OCI_HOST }}" >> ~/.ssh/known_hosts
          # Keepalive so a long docker build doesn't get killed by an idle
          # connection timeout mid-command (silently leaves the container
          # "Created" but never started -- happened once, see commit history).
          cat >> ~/.ssh/config <<EOF
          Host oci-vm2
            HostName ${{ secrets.OCI_HOST }}
            User ${{ secrets.OCI_USER }}
            IdentityFile ~/.ssh/oci_key
            ServerAliveInterval 15
            ServerAliveCountMax 10
          EOF

      - name: Sync files to VM-2
        run: |
          rsync -avz --delete \
            -e "ssh -o ServerAliveInterval=15 -o ServerAliveCountMax=10 -i ~/.ssh/oci_key" \
            --exclude 'node_modules' --exclude '.git' --exclude 'dist' --exclude '.astro' \
            ./ "${{ secrets.OCI_USER }}@${{ secrets.OCI_HOST }}:~/eloo-digital/"

      - name: Build container image
        run: ssh oci-vm2 'cd ~/eloo-digital && sudo docker compose build'

      - name: Restart container
        run: ssh oci-vm2 'cd ~/eloo-digital && sudo docker compose up -d'
