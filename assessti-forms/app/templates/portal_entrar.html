<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Acesso — {{ nome_cliente }} · eloo Assessment</title>
  <style>
    :root{
      --deep:#1a2421; --mint:#c2e7d9; --salvia:#6b8e81;
      --dourado:#d4af37; --parchment:#f4f2ea; --ink:#23261f; --ink-muted:#5b5f52;
      --red:#a4433a;
    }
    *{box-sizing:border-box;}
    body{
      margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
      background:var(--parchment); color:var(--ink);
      font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      padding:24px;
    }
    .card{
      max-width:380px; width:100%; text-align:center; background:#fff;
      border:1px solid #d9d6c4; border-radius:14px; padding:40px 32px;
    }
    .marca{
      font-family:'Montserrat', sans-serif; font-weight:800; letter-spacing:-0.02em;
      color:var(--deep); font-size:1.1rem; margin-bottom:20px; display:inline-block;
    }
    .marca .dot{color:var(--dourado);}
    .eyebrow{ text-transform:uppercase; letter-spacing:0.08em; font-size:12px; color:var(--salvia); font-weight:700; }
    h1{font-size:1.3rem; margin:10px 0 6px; color:var(--deep);}
    p.sub{color:var(--ink-muted); font-size:14px; margin:0 0 22px;}
    p.erro{color:var(--red); font-size:14px; font-weight:600; margin:0 0 14px;}
    input[type=password]{
      width:100%; max-width:200px; text-align:center; font-size:20px; letter-spacing:0.3em;
      padding:10px; border:1px solid #d9d6c4; border-radius:8px; margin:0 auto 18px; display:block;
    }
    button{
      width:100%; max-width:200px; margin:0 auto; display:block; cursor:pointer;
      background:var(--dourado); color:var(--deep); border:none; border-radius:999px;
      padding:0.7rem 1rem; font-size:0.95rem; font-weight:700;
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="marca">el<span class="oo">oo</span><span class="dot">.</span>digital</span>
    <div class="eyebrow">Acesso restrito</div>
    <h1>{{ nome_cliente }}</h1>
    <p class="sub">Digite o PIN de acesso ao seu Assessment.</p>
    {% if erro %}
    <p class="erro">PIN incorreto — tente de novo.</p>
    {% endif %}
    <form method="post">
      <input type="hidden" name="next" value="{{ next }}">
      <input type="password" inputmode="numeric" name="pin" autofocus placeholder="PIN">
      <button type="submit">Entrar</button>
    </form>
  </div>
</body>
</html>
