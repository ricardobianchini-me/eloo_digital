<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="IBM Plex Sans, Arial, sans-serif">
  <rect width="900" height="640" rx="14" fill="#f4f6fa"/>
  <!-- barra lateral -->
  <rect x="0" y="0" width="210" height="640" rx="14" fill="#ffffff"/>
  <rect x="0" y="0" width="210" height="640" fill="#ffffff"/>
  <line x1="210" y1="0" x2="210" y2="640" stroke="#e3e7ef"/>
  <rect x="22" y="22" width="26" height="26" rx="6" fill="#1f6fd1"/>
  <text x="58" y="41" font-size="16" font-weight="700" fill="#1d2433">PACCE</text>
  <g font-size="13" fill="#4a5468">
    <text x="30" y="98" fill="#1f6fd1" font-weight="600">Atendimento</text>
    <text x="30" y="130">Visão geral</text>
    <text x="30" y="162">Indicadores</text>
    <text x="30" y="194">Pessoas atendidas</text>
    <text x="30" y="250" font-size="10" fill="#8a93a6" letter-spacing="1">COORDENAÇÃO</text>
    <text x="30" y="276">Agenda</text>
    <text x="30" y="308">Turnos e escalas</text>
    <text x="30" y="340">Equipes</text>
    <text x="30" y="396" font-size="10" fill="#8a93a6" letter-spacing="1">ADMINISTRAÇÃO</text>
    <text x="30" y="422">Cadastros</text>
    <text x="30" y="454">Relatórios</text>
    <text x="30" y="486">Configurações</text>
  </g>
  <rect x="30" y="580" width="150" height="34" rx="8" fill="#f1f4f9"/>
  <text x="44" y="601" font-size="12" fill="#4a5468">Usuário de exemplo</text>
  <!-- cabeçalho -->
  <text x="240" y="48" font-size="11" fill="#1f6fd1" font-weight="600" letter-spacing="1">ORGANIZAÇÃO EXEMPLO</text>
  <text x="240" y="78" font-size="22" font-weight="700" fill="#1d2433">Atendimentos de hoje</text>
  <text x="240" y="112" font-size="13" font-weight="600" fill="#4a5468">Escolha o tipo de atendimento</text>
  <!-- cards de atendimento -->
  <g>
    <rect x="240" y="128" width="190" height="96" rx="12" fill="#ffffff" stroke="#e3e7ef"/>
    <text x="258" y="158" font-size="14" font-weight="700" fill="#1f6fd1">Acolhimento</text>
    <text x="258" y="182" font-size="11" fill="#8a93a6">Primeiro contato e cadastro</text>
    <text x="258" y="206" font-size="11" fill="#4a5468">12 hoje</text>

    <rect x="450" y="128" width="190" height="96" rx="12" fill="#ffffff" stroke="#e3e7ef"/>
    <text x="468" y="158" font-size="14" font-weight="700" fill="#1f6fd1">Atendimento</text>
    <text x="468" y="182" font-size="11" fill="#8a93a6">Orientação e encaminhamento</text>
    <text x="468" y="206" font-size="11" fill="#4a5468">8 hoje</text>

    <rect x="660" y="128" width="190" height="96" rx="12" fill="#ffffff" stroke="#e3e7ef"/>
    <text x="678" y="158" font-size="14" font-weight="700" fill="#1f6fd1">Retorno</text>
    <text x="678" y="182" font-size="11" fill="#8a93a6">Acompanhamento de casos</text>
    <text x="678" y="206" font-size="11" fill="#4a5468">5 hoje</text>

    <rect x="240" y="240" width="190" height="96" rx="12" fill="#ffffff" stroke="#e3e7ef"/>
    <text x="258" y="270" font-size="14" font-weight="700" fill="#1f6fd1">Plantão</text>
    <text x="258" y="294" font-size="11" fill="#8a93a6">Escala do dia</text>
    <text x="258" y="318" font-size="11" fill="#4a5468">4 pessoas</text>

    <rect x="450" y="240" width="190" height="96" rx="12" fill="#ffffff" stroke="#e3e7ef"/>
    <text x="468" y="270" font-size="14" font-weight="700" fill="#1f6fd1">Oficina</text>
    <text x="468" y="294" font-size="11" fill="#8a93a6">Atividades em grupo</text>
    <text x="468" y="318" font-size="11" fill="#4a5468">2 turmas</text>

    <rect x="660" y="240" width="190" height="96" rx="12" fill="#ffffff" stroke="#e3e7ef"/>
    <text x="678" y="270" font-size="14" font-weight="700" fill="#1f6fd1">Documentos</text>
    <text x="678" y="294" font-size="11" fill="#8a93a6">Termos e registros</text>
    <text x="678" y="318" font-size="11" fill="#4a5468">3 pendentes</text>
  </g>
  <!-- lista da fila -->
  <rect x="240" y="362" width="610" height="250" rx="12" fill="#ffffff" stroke="#e3e7ef"/>
  <text x="262" y="394" font-size="13" font-weight="700" fill="#1d2433">Fila de atendimento</text>
  <g font-size="12" fill="#4a5468">
    <line x1="262" y1="410" x2="828" y2="410" stroke="#eef1f6"/>
    <text x="262" y="436">Pessoa 01</text><text x="520" y="436">Acolhimento</text><text x="700" y="436" fill="#1f6fd1">Em espera</text>
    <line x1="262" y1="450" x2="828" y2="450" stroke="#eef1f6"/>
    <text x="262" y="476">Pessoa 02</text><text x="520" y="476">Atendimento</text><text x="700" y="476" fill="#1f6fd1">Em andamento</text>
    <line x1="262" y1="490" x2="828" y2="490" stroke="#eef1f6"/>
    <text x="262" y="516">Pessoa 03</text><text x="520" y="516">Retorno</text><text x="700" y="516" fill="#8a93a6">Agendado</text>
    <line x1="262" y1="530" x2="828" y2="530" stroke="#eef1f6"/>
    <text x="262" y="556">Pessoa 04</text><text x="520" y="556">Documentos</text><text x="700" y="556" fill="#8a93a6">Pendente</text>
  </g>
  <text x="240" y="630" font-size="10" fill="#8a93a6">Ilustração com dados de exemplo</text>
</svg>
