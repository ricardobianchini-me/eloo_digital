<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Não foi possível enviar — eloo Assessment</title>
  <style>
    :root{
      --deep:#1a2421; --deep-2:#141c19; --mint:#c2e7d9; --salvia:#6b8e81;
      --dourado:#d4af37; --parchment:#f4f2ea; --ink:#23261f; --ink-muted:#5b5f52;
    }
    *{box-sizing:border-box;}
    body{
      margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
      background:var(--parchment); color:var(--ink);
      font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      padding:24px;
    }
    .card{max-width:480px; text-align:center;}
    .marca{
      font-family:'Montserrat', sans-serif; font-weight:800; letter-spacing:-0.02em;
      color:var(--deep); font-size:1.1rem; margin-bottom:28px; display:inline-block;
    }
    .marca .dot{color:var(--dourado);}
    h1{font-size:1.5rem; margin:0 0 14px; color:var(--deep);}
    p{font-family:Georgia,serif; color:var(--ink-muted); font-size:1rem; line-height:1.6;}
    a.voltar{
      display:inline-block; margin-top:24px; text-decoration:none; font-weight:700;
      background:var(--dourado); color:var(--deep); padding:0.7rem 1.6rem; border-radius:999px;
      font-size:0.95rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="marca">el<span class="oo">oo</span><span class="dot">.</span>digital</span>
    <h1>Não foi possível enviar sua mensagem.</h1>
    <p>Confira se preencheu nome, empresa e um e-mail válido, e tente de novo — ou escreva direto para <a href="mailto:contato@eloo.digital">contato@eloo.digital</a>.</p>
    <a class="voltar" href="/assessment">&larr; Voltar</a>
  </div>
</body>
</html>
