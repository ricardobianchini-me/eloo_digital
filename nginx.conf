server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Portais de cliente (eloo Assessment): pasta /assessment/{cliente}/ é
    # protegida por senha. A landing pública /assessment fica fora daqui.
    location /assessment/super-logistica/ {
        auth_basic "eloo Assessment — área restrita do cliente";
        auth_basic_user_file /etc/nginx/.htpasswd;
        try_files $uri $uri/ =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
