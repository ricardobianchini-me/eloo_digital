name: Deploy to VM-2 (eloo.digital)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-eloo-digital
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.OCI_SSH_KEY }}" > ~/.ssh/oci_key
          chmod 600 ~/.ssh/oci_key
          ssh-keyscan -H "${{ secrets.OCI_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync files to VM-2
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/oci_key" \
            --exclude 'node_modules' --exclude '.git' --exclude 'dist' --exclude '.astro' \
            ./ "${{ secrets.OCI_USER }}@${{ secrets.OCI_HOST }}:~/eloo-digital/"

      - name: Build and restart container
        run: |
          ssh -i ~/.ssh/oci_key "${{ secrets.OCI_USER }}@${{ secrets.OCI_HOST }}" \
            'cd ~/eloo-digital && sudo docker compose build --no-cache && sudo docker compose up -d'
