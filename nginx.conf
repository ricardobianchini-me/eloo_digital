server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Portais de cliente (eloo Assessment) NÃO são protegidos aqui —
    # 2026-09-16: o gate por PIN foi movido pro nginx do host (auth_request
    # contra o app assessti-forms, ver hlera-bot/nginx/vm2-apps/eloo-digital)
    # pra unificar a UX de login com a ferramenta interna (só PIN, sem popup
    # nativo de usuário+senha do navegador). Duplicar Basic Auth aqui dentro
    # do container quebraria esse fluxo com uma segunda credencial.

    location / {
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
}
